CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_RAW_HID=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_WPM=y

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25

# Fonts and widgets for custom status screen
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_USE_BAR=y

# Right-half rotation is set via CONFIG_LV_Z_DISPLAY_ROTATION_90 in lily58_right.conf

# Debounce. ZMK defaults to 5/5 ms; release chatter on a worn switch is what
# produces doubled/tripled letters, so the release window is the one to widen.
# ponytail: tuning knob. Still chattering? raise RELEASE to 12-15. If only one
# or two keys chatter it is a worn switch or a cold joint, not a config value.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
