name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  # keymap-reference.html restates the keymap by hand, and the published
  # artifact is a third copy of it. Both drifted in practice — the first into
  # documenting removed home row mods, the second into missing a whole layer.
  reference:
    name: Keymap reference in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-keymap-reference.py
