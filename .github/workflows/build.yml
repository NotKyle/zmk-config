name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  # keymap-reference.html restates the keymap by hand. The previous one drifted
  # into documenting home row mods that had been removed two commits earlier.
  reference:
    name: Keymap reference in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-keymap-reference.py
